# Локальная проверка: ./gradlew --continue assemble check printCoverage

image: "${GITLAB_DOCKER_PROXY}/library/gradle:9.7.1-jdk25"

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

variables:
  GITLAB_DOCKER_PROXY: "gitlab.education.tbank.ru:443/t-academy-2026/java-advanced/materials/dependency_proxy/containers"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

default:
  interruptible: true
  cache:
    key: "gradle-$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/caches

stages:
  - verify

check:
  stage: verify
  # Один запуск Gradle для сборки, линтеров и тестов.
  # --continue позволяет получить остальные отчёты при ошибке одной из проверок.
  script:
    - gradle --continue --stacktrace --console=plain assemble check printCoverage
  coverage: '/Покрытие инструкций: (\d+\.\d+)%/'
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/TEST-*.xml
    paths:
      - build/libs
      - build/reports/checkstyle
      - build/reports/tests
      - build/reports/jacoco
    expire_in: 1 week
